[package]
name = "owly-gui"
description = "The Owly AirDrop window: a Tauri app over owly-session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "owly_gui"
path = "src/lib.rs"

[[bin]]
name = "owly-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
owly-airdrop = { path = "../owly-airdrop", features = ["mdns"] }
owly-session = { path = "../owly-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
