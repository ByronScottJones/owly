[workspace]
members = ["crates/*", "xtask"]
# Built with nightly and cargo-fuzz, on its own.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
# owly's version: the published crates, owlyd and the CLI. The `owly`
# package and its `owly-v<version>` tag follow it (packaging/arch/owly), and
# so does owly-radio's requirement on owly-awdl, which publishing needs.
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/t4t5/owly"

[workspace.lints.rust]
# Code that needs unsafe allows it locally, with a SAFETY comment.
unsafe_code = "deny"
